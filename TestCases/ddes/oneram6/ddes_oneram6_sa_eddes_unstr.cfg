% Hybrid RANS/LES model SA_EDDES_UNSTR, ONERA M6 wing on a hexahedral grid.
% The simulation restarts from a partially converged SA RANS solution (solution_flow_sa_00000.dat),
% so that the LES branch of the length scale is active in the turbulent regions.
%
% ------------------------------ PROBLEM DEFINITION ------------------------------%
SOLVER= RANS
KIND_TURB_MODEL= SA
HYBRID_RANSLES= SA_EDDES_UNSTR
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
RESTART_ITER= 1
%
% ------------------------------ TIME INTEGRATION --------------------------------%
TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-1ST_ORDER
TIME_STEP= 1e-4
TIME_ITER= 6
INNER_ITER= 2
%
% ------------------------------ FREE-STREAM -------------------------------------%
MACH_NUMBER= 0.8395
AOA= 3.06
SIDESLIP_ANGLE= 0.0
FREESTREAM_TEMPERATURE= 288.15
REYNOLDS_NUMBER= 11.72E6
REYNOLDS_LENGTH= 0.64607
FLUID_MODEL= STANDARD_AIR
VISCOSITY_MODEL= SUTHERLAND
%
% ------------------------------ REFERENCE VALUES --------------------------------%
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 0.64607
REF_AREA= 0
%
% ------------------------------ BOUNDARY CONDITIONS -----------------------------%
MARKER_HEATFLUX= ( WING, 0.0 )
MARKER_FAR= ( FARFIELD )
MARKER_SYM= ( SYMMETRY )
MARKER_PLOTTING= ( WING )
MARKER_MONITORING= ( WING )
%
% ------------------------------ NUMERICS ----------------------------------------%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 4.0
CFL_ADAPT= NO
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= LU_SGS
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 5
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 1.0
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 10
%
% ------------------------------ INPUT/OUTPUT ------------------------------------%
MESH_FILENAME= ../../rans/oneram6/mesh_ONERAM6_turb_hexa_43008.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= solution_flow_sa
OUTPUT_FILES= (RESTART)
OUTPUT_WRT_FREQ= 250
SCREEN_OUTPUT= (TIME_ITER, INNER_ITER, RMS_DENSITY, RMS_NU_TILDE, LIFT, DRAG)
HISTORY_OUTPUT= (ITER, RMS_RES, AERO_COEFF)
