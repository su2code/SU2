% Transition on the 6:1 prolate spheroid at 15 degrees angle of attack, one-equation (simplified) LM model
% SST (Menter et al. 2015).
% Coarse unstructured grid (100958 points), restart from a converged SST + MENTER_SLM solution
% (solution_flow_sst_slm.dat), so that the transition front is established.
%
% ------------------------------ PROBLEM DEFINITION ------------------------------%
SOLVER= INC_RANS
KIND_TURB_MODEL= SST
SST_OPTIONS= ( KATO-LAUNDER )
KIND_TRANS_MODEL= LM
LM_OPTIONS= ( SLM, MENTER_SLM )
FREESTREAM_TURBULENCEINTENSITY= 0.001
FREESTREAM_TURB2LAMVISCRATIO= 5.0
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
%
% ------------------------------ FREE-STREAM -------------------------------------%
INC_DENSITY_INIT= 1.177
INC_TEMPERATURE_INIT= 300
INC_VELOCITY_INIT= ( 43.4667, 0.0, 11.647 )
INC_NONDIM= INITIAL_VALUES
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.853e-05
%
% ------------------------------ REFERENCE VALUES --------------------------------%
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 2.4
REF_AREA= 0
%
% ------------------------------ BOUNDARY CONDITIONS -----------------------------%
MARKER_HEATFLUX= ( Ellipsoid, 0.0 )
MARKER_FAR= ( Farfield )
MARKER_PLOTTING= ( Ellipsoid )
MARKER_MONITORING= ( Ellipsoid )
%
% ------------------------------ NUMERICS ----------------------------------------%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 20
CFL_ADAPT= NO
ITER= 5
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 10
CONV_NUM_METHOD_FLOW= JST
MUSCL_FLOW= NO
JST_SENSOR_COEFF= ( 0.5, 0.02 )
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT
CONV_RESIDUAL_MINVAL= -12
CONV_FIELD= ( RMS_PRESSURE )
%
% ------------------------------ INPUT/OUTPUT ------------------------------------%
MESH_FILENAME= spheroid_tiny.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= solution_flow_sst_slm.dat
RESTART_FILENAME= restart_flow.dat
OUTPUT_FILES= (RESTART)
OUTPUT_WRT_FREQ= 1000
SCREEN_OUTPUT= (INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, RMS_TKE, RMS_DISSIPATION, RMS_INTERMITTENCY, LIFT, DRAG)
HISTORY_OUTPUT= (ITER, RMS_RES, AERO_COEFF)
