GAS_COMPOSITION= (0.77, 0.23, 0.0, 0.0, 0.0)
FLUID_MODEL= SU2_NONEQ
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

MACH_NUMBER= 5
AOA= 0.0
INIT_OPTION= TD_CONDITIONS
