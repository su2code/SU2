MARKER_EULER= ( Euler )
MARKER_HEATFLUX= ( Wall, 2000 )
MARKER_OUTLET= ( Exit, 5 )
MARKER_FAR= ( Farfield, Inlet )
MARKER_PLOTTING= ( NONE )
MARKER_MONITORING= ( Wall )

