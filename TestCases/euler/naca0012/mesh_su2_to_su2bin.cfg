%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
% SU2 configuration file                                                       %
% Case description: Convert mesh_NACA0012_inv.su2 to the native SU2 binary     %
% mesh format (.su2b), for the naca0012_su2bin regression test.                %
% A zero-magnitude grid translation is used.                                   %
% File Version 8.5.0 "Harrier"                                                 %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= EULER
MARKER_EULER= ( airfoil )
MARKER_FAR= ( farfield )

% ----------------------- DESIGN VARIABLE PARAMETERS --------------------------%
%
DV_KIND= TRANSLATE_GRID
DV_MARKER= ( airfoil )
DV_PARAM= ( 1.0, 0.0, 0.0 )
DV_VALUE= 0.0

% ---------------------- GRID DEFORMATION PARAMETERS ---------------------------%
%
DEFORM_LINEAR_SOLVER= FGMRES
DEFORM_LINEAR_SOLVER_PREC= ILU
DEFORM_LINEAR_SOLVER_ERROR= 1E-14
DEFORM_LINEAR_SOLVER_ITER= 500
DEFORM_NONLINEAR_ITER= 1
DEFORM_STIFFNESS_TYPE= INVERSE_VOLUME

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= mesh_NACA0012_inv.su2
MESH_FORMAT= SU2
MESH_OUT_FILENAME= mesh_NACA0012_inv_su2bin
MESH_OUT_FORMAT= SU2B
