%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Supersonic inviscid flow around a biparabolic airfoil      %
% Author: Trent W. Lukaczyk                                                    %
% Institution: Stanford University                                             %
% Date: 2012.08.16                                                             %
% File Version 8.5.0 "Harrier"                                                 %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% ----------- COMPRESSIBLE AND INCOMPRESSIBLE FREE-STREAM DEFINITION ----------%
%
MACH_NUMBER= 1.7
AOA= 0.0
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15

% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
%
REF_ORIGIN_MOMENT_X = 0.25
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

% ----------------------- BOUNDARY CONDITION DEFINITION -----------------------%
%
MARKER_EULER= ( airfoil )
MARKER_FAR= ( farfield)
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )


% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 2.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.5, 1.0, 50.0 )
ITER= 500

% ---------------- ADJOINT-FLOW NUMERICAL METHOD DEFINITION -------------------%
%

OBJECTIVE_FUNCTION= EQUIVALENT_AREA
CONV_NUM_METHOD_ADJFLOW= JST
ADJ_SHARP_LIMITER_COEFF= 3.0
ADJ_JST_SENSOR_COEFF= ( 0.0, 0.02 )
CFL_REDUCTION_ADJFLOW= 0.8
TIME_DISCRE_ADJFLOW= EULER_IMPLICIT

% ------------------------ GRID DEFORMATION PARAMETERS ------------------------%
%

DV_KIND= PARABOLIC
DV_MARKER= ( airfoil )
DV_PARAM= ( 0.5, 5 )
DV_VALUE= 0.01
HOLD_GRID_FIXED= YES
HOLD_GRID_FIXED_COORD= ( -0.2, -0.4, 0.0, 2.2, 0.4, 0.0 )

% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%

MGLEVEL= 0

% ------------------------ SUPERSONIC SIMULATION ------------------------------%
%

% Equivalent-area / nearfield setup for sonic-boom studies. Disabled for the
% direct solve: enabling these produces 760 non-physical points and rms[Rho]
% stalls at +3.4 instead of -3.9. Re-enable together with MARKER_NEARFIELD
% below (and remove those two markers from MARKER_FAR) for adjoint EA work.
%
% EQUIV_AREA= YES
% EA_INT_LIMIT= ( -100.0, 100.0, 2.0 )
  MARKER_NEARFIELD= ( upper_nearfield, lower_nearfield )


% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
TIME_DISCRE_FLOW= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_RESIDUAL_MINVAL= -6
CONV_STARTITER= 10

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= mesh_BIPARABOLIC_sup.su2
MESH_FORMAT= SU2
MESH_OUT_FILENAME= mesh_out
SOLUTION_FILENAME= solution_flow
SOLUTION_ADJ_FILENAME= solution_adj
TABULAR_FORMAT= CSV
CONV_FILENAME= history
RESTART_FILENAME= restart_flow
RESTART_ADJ_FILENAME= restart_adj
VOLUME_FILENAME= volume_flow
VOLUME_ADJ_FILENAME= volume_adjoint
GRAD_OBJFUNC_FILENAME= of_grad
SURFACE_FILENAME= surface_flow
SURFACE_ADJ_FILENAME= surface_adjoint
OUTPUT_WRT_FREQ= 500
