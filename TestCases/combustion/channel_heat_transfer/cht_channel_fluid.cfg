%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Fluid zone of the conjugate heat transfer channel, laminar  %
%                   O2/N2 flow with the compressible solver and Cantera, the    %
%                   wall is coupled to the solid zone (cht_channel_solid.cfg).  %
%                                                                              %
% Date: 2026.10.12                                                             %
% File Version 8.5.0 "Harrier"                                                 %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= NAVIER_STOKES
KIND_TURB_MODEL= NONE
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% -------------------- COMPRESSIBLE FREE-STREAM DEFINITION --------------------%
%
MACH_NUMBER= 0.05
AOA= 0.0
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 400.0
REF_DIMENSIONALIZATION= DIMENSIONAL

% ---------------------------- FLUID MODEL ------------------------------------%
%
FLUID_MODEL= FLUID_CANTERA
CANTERA_MECHANISM_FILE= h2o2.yaml
CANTERA_PHASE_NAME= ohmech
CANTERA_TRANSPORT_MODEL= mixture-averaged
CANTERA_SPECIES_NAMES= O2, N2
CANTERA_COMBUSTION= NO
VISCOSITY_MODEL= CANTERA
CONDUCTIVITY_MODEL= CANTERA

% -------------------- SPECIES TRANSPORT ---------------------------------------%
%
KIND_SCALAR_MODEL= SPECIES_TRANSPORT
DIFFUSIVITY_MODEL= CANTERA
SPECIES_INIT= 0.2329
CONV_NUM_METHOD_SPECIES= BOUNDED_SCALAR
MUSCL_SPECIES= NO
TIME_DISCRE_SPECIES= EULER_IMPLICIT

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
% Total conditions at the inlet, static pressure at the outlet (Riemann)
MARKER_RIEMANN= ( inlet, TOTAL_CONDITIONS_PT, 103050.0, 400.0, 1.0, 0.0, 0.0, outlet, STATIC_PRESSURE, 101325.0, 0.0, 0.0, 0.0, 0.0 )
MARKER_INLET_SPECIES= ( inlet, 0.2329 )
MARKER_SYM= ( symmetry )
MARKER_PLOTTING= ( wall )
MARKER_MONITORING= ( wall )
MARKER_ANALYZE= ( inlet, outlet )
MARKER_ANALYZE_AVERAGE= MASSFLUX

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 50.0
CFL_ADAPT= NO
INNER_ITER= 1

% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 20

% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%
MGLEVEL= 0

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
SCREEN_OUTPUT= INNER_ITER, RMS_DENSITY, RMS_ENERGY, RMS_SPECIES_O2, LINSOL_RESIDUAL, TOTAL_HEATFLUX
SCREEN_WRT_FREQ_INNER= 100
HISTORY_OUTPUT= ITER, RMS_RES, LINSOL, HEAT, FLOW_COEFF
CONV_FILENAME= history
OUTPUT_FILES= RESTART_ASCII, TECPLOT_ASCII
VOLUME_OUTPUT= SOLUTION, PRIMITIVE
RESTART_FILENAME= restart_flow
SOLUTION_FILENAME= solution_flow
VOLUME_FILENAME= flow
