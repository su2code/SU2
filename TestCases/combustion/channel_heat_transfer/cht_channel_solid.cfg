%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Solid zone of the conjugate heat transfer channel, a wall  %
%                   layer with a fixed outer temperature and adiabatic ends.    %
% Date: 2026.10.12                                                             %
% File Version 8.5.0 "Harrier"                                                 %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= HEAT_EQUATION
RESTART_SOL= NO
INC_NONDIM= DIMENSIONAL
FREESTREAM_TEMPERATURE= 300.0

% --------------------------- SOLID PROPERTIES --------------------------------%
%
MATERIAL_DENSITY= 2000.0
SPECIFIC_HEAT_CP= 800.0
THERMAL_CONDUCTIVITY_CONSTANT= 0.1

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_ISOTHERMAL= ( solid_outer, 300.0 )
MARKER_HEATFLUX= ( solid_inlet, 0.0, solid_outlet, 0.0 )
MARKER_PLOTTING= ( solid_wall )
MARKER_MONITORING= ( solid_outer )

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 1.0E6
INNER_ITER= 1
TIME_DISCRE_HEAT= EULER_IMPLICIT
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-10
LINEAR_SOLVER_ITER= 20

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
SCREEN_OUTPUT= INNER_ITER, RMS_TEMPERATURE, TOTAL_HEATFLUX
HISTORY_OUTPUT= ITER, RMS_RES, HEAT
OUTPUT_FILES= RESTART_ASCII, TECPLOT_ASCII
VOLUME_OUTPUT= SOLUTION, PRIMITIVE
RESTART_FILENAME= restart_flow
SOLUTION_FILENAME= solution_flow
VOLUME_FILENAME= flow
