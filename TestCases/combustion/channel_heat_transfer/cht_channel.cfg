%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Conjugate heat transfer between a laminar O2/N2 channel    %
%                   flow (compressible solver with Cantera) and a solid wall.   %
%                   The heat through the solid equals the enthalpy drop of the  %
%                   fluid, see energy_balance.py.                               %
% Date: 2026.10.12                                                             %
% File Version 8.5.0 "Harrier"                                                 %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

SOLVER= MULTIPHYSICS
MATH_PROBLEM= DIRECT
CONFIG_LIST= ( cht_channel_fluid.cfg, cht_channel_solid.cfg )

MARKER_ZONE_INTERFACE= ( wall, solid_wall )
MARKER_CHT_INTERFACE= ( wall, solid_wall )
CHT_COUPLING_METHOD= DIRECT_TEMPERATURE_ROBIN_HEATFLUX

TIME_DOMAIN= NO
OUTER_ITER= 4000
CONV_FIELD= AVG_BGS_RES[0], AVG_BGS_RES[1]
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 10

MESH_FILENAME= channel_cht.su2
MESH_FORMAT= SU2

SCREEN_OUTPUT= OUTER_ITER, BGS_DENSITY[0], BGS_ENERGY[0], BGS_TEMPERATURE[1], TOTAL_HEATFLUX[0], TOTAL_HEATFLUX[1]
SCREEN_WRT_FREQ_OUTER= 100
HISTORY_OUTPUT= ITER, BGS_RES[0], BGS_RES[1], TOTAL_HEATFLUX[0], TOTAL_HEATFLUX[1]
OUTPUT_WRT_FREQ= 4000
