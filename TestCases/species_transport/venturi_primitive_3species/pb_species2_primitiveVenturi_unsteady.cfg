%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Unsteady laminar mixing of 2 species in the venturi with   %
%                   the pressure-based solver. The density depends on the      %
%                   mixture, so d(rho)/dt in the pressure correction needs the %
%                   species of the old time levels.                            %
% File Version 8.5.0 "Harrier"                                                 %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= INC_NAVIER_STOKES
KIND_INCOMP_SYSTEM= PRESSURE_BASED
%
% ------------------------- UNSTEADY SIMULATION -------------------------------%
%
TIME_DOMAIN= YES
TIME_MARCHING= DUAL_TIME_STEPPING-2ND_ORDER
TIME_STEP= 0.01
TIME_ITER= 2
INNER_ITER= 10
%
% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION -------------------%
%
INC_DENSITY_MODEL= VARIABLE
INC_DENSITY_INIT= 1.1766
INC_VELOCITY_INIT= ( 1.00, 0.0, 0.0 )
INC_ENERGY_EQUATION= YES
INC_TEMPERATURE_INIT= 300.0
INC_NONDIM= DIMENSIONAL
%
% -------------------- FLUID PROPERTIES ------------------------------------- %
%
FLUID_MODEL= FLUID_MIXTURE
THERMODYNAMIC_PRESSURE= 101325.0
MOLECULAR_WEIGHT= 28.96, 16.043
SPECIFIC_HEAT_CP = 1009.39, 1009.39
CONDUCTIVITY_MODEL= CONSTANT_CONDUCTIVITY
THERMAL_CONDUCTIVITY_CONSTANT= 0.0357, 0.0357
PRANDTL_LAM= 0.72, 0.72
TURBULENT_CONDUCTIVITY_MODEL= NONE
PRANDTL_TURB= 0.90, 0.90
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.716E-5, 1.716E-5
%
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_HEATFLUX= ( wall, 0.0 )
MARKER_SYM= ( axis )
INC_INLET_TYPE= VELOCITY_INLET VELOCITY_INLET
MARKER_INLET= ( gas_inlet,       300, 1.0, 1.0,  0.0, 0.0,\
                air_axial_inlet, 300, 1.0, 0.0, -1.0, 0.0 )
MARKER_INLET_SPECIES= (gas_inlet, 1.0, air_axial_inlet, 0.6)
INC_OUTLET_TYPE= PRESSURE_OUTLET
MARKER_OUTLET= ( outlet, 0.0 )
%
% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 10.0
CFL_ADAPT= NO
CFL_REDUCTION_SPECIES= 1.0
%
% ------------------------ PRESSURE-BASED PARAMETERS --------------------------%
%
KIND_PB_ITER= SIMPLEC
TRANSIENT_TERM_REMOVAL_FACTOR= 0.0
RELAXATION_FACTOR_PRESSURE= 1.0
PISO_CORRECTIONS= 1
POISSON_LINEAR_SOLVER= FGMRES
POISSON_LINEAR_SOLVER_PREC= LU_SGS
POISSON_LINEAR_SOLVER_ERROR= 1E-6
POISSON_LINEAR_SOLVER_ITER= 200
%
% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-8
LINEAR_SOLVER_ITER= 10
%
% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= UDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
%
% -------------------- SCALAR TRANSPORT ---------------------------------------%
%
KIND_SCALAR_MODEL= SPECIES_TRANSPORT
DIFFUSIVITY_MODEL= CONSTANT_DIFFUSIVITY
DIFFUSIVITY_CONSTANT= 0.001
CONV_NUM_METHOD_SPECIES= SCALAR_UPWIND
MUSCL_SPECIES= NO
SLOPE_LIMITER_SPECIES= NONE
TIME_DISCRE_SPECIES= EULER_IMPLICIT
SPECIES_INIT= 1.0
SPECIES_CLIPPING= YES
SPECIES_CLIPPING_MIN= 0.0
SPECIES_CLIPPING_MAX= 1.0
%
% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_FIELD= RMS_PRESSURE
CONV_RESIDUAL_MINVAL= -14
CONV_STARTITER= 10
%
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= primitiveVenturi.su2
SCREEN_OUTPUT= TIME_ITER INNER_ITER RMS_PRESSURE RMS_VELOCITY-X RMS_VELOCITY-Y RMS_SPECIES_0
HISTORY_OUTPUT= RMS_RES
OUTPUT_FILES= RESTART
OUTPUT_WRT_FREQ= 1000
RESTART_SOL= NO
CONV_FILENAME= history_pb_unsteady
RESTART_FILENAME= restart_pb_unsteady
