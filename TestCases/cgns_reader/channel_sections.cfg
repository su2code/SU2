% Test of the CGNS mesh reader with boundaries split in several sections, as meshers write them.
% The mesh is a small 3D channel, with hexahedra in the first half and prisms in the second half.
% The CGNS file has 9 boundary sections and a ZoneBC with 5 boundary conditions (BC):
%   inlet                  : no BC covers it, the marker is named after the section ("inlet")
%   upper_side             : BC "upper" without family, the marker is named after the BC ("upper")
%   lower_1, lower_2       : BC "lower_wall" of family "lower", one marker "lower"
%   quad_back, tri_back    : BC "back" of family "back", one marker "back" with quadrilaterals and triangles
%   quad_front, tri_front  : BC "front" of family "front", one marker "front"
%   outlet                 : BC "outlet" of family "outlet", marker "outlet"
% The markers of this config file are the names above, so the case only runs if the reader
% groups the sections into markers through the ZoneBC.
%
% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
%
% ----------- COMPRESSIBLE AND INCOMPRESSIBLE FREE-STREAM DEFINITION ----------%
MACH_NUMBER= 0.3
AOA= 0.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 101325.0
FREESTREAM_TEMPERATURE= 288.15
%
% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
REF_ORIGIN_MOMENT_X= 0.0
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 1.0
REF_AREA= 1.0
%
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
MARKER_EULER= ( lower, upper )
MARKER_SYM= ( back, front )
MARKER_INLET= ( inlet, 293.336, 107822.0, 1.0, 0.0, 0.0 )
MARKER_OUTLET= ( outlet, 101325.0 )
%
% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 10.0
CFL_ADAPT= NO
ITER= 10
%
% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 10
%
% ----------------------- FLOW NUMERICAL METHOD DEFINITION --------------------%
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
%
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
MESH_FILENAME= mesh_channel_sections.cgns
MESH_FORMAT= CGNS
SCREEN_OUTPUT= INNER_ITER RMS_DENSITY RMS_MOMENTUM-X RMS_MOMENTUM-Y RMS_ENERGY
HISTORY_OUTPUT= ITER RMS_RES
OUTPUT_FILES= NONE
