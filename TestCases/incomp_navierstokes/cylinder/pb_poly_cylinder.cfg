%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Steady incompressible laminar flow around a heated        %
%                    cylinder with a polynomial fluid model, pressure-based,  %
%                    coupled energy equation and variable density.            %
% File Version 8.5.0 "Harrier"                                                %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= INC_NAVIER_STOKES
KIND_INCOMP_SYSTEM= PRESSURE_BASED
KIND_TURB_MODEL= NONE
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION -------------------%
%
INC_DENSITY_MODEL= VARIABLE
INC_ENERGY_EQUATION = YES
INC_DENSITY_INIT= 0.000210322
INC_VELOCITY_INIT= ( 3.40297, 0.0, 0.0 )
INC_TEMPERATURE_INIT= 288.15
INC_NONDIM= DIMENSIONAL

% ---- IDEAL GAS, POLYTROPIC, VAN DER WAALS AND PENG ROBINSON CONSTANTS -------%
%
FLUID_MODEL= INC_IDEAL_GAS_POLY
SPECIFIC_HEAT_CP= 1004.703
MOLECULAR_WEIGHT= 28.96
CP_POLYCOEFFS= ( 1004.703, 0.1, 0.0, 0.0, 0.0)

% --------------------------- VISCOSITY MODEL ---------------------------------%
%
VISCOSITY_MODEL= POLYNOMIAL_VISCOSITY
MU_CONSTANT= 1.7893e-05
MU_POLYCOEFFS= (1.7893e-05, 1e-8, 0.0, 0.0, 0.0)

% --------------------------- THERMAL CONDUCTIVITY MODEL ----------------------%
%
CONDUCTIVITY_MODEL= POLYNOMIAL_CONDUCTIVITY
THERMAL_CONDUCTIVITY_CONSTANT= 0.0257
PRANDTL_LAM= 0.72
KT_POLYCOEFFS= (0.0257, 1e-5, 0.0, 0.0, 0.0)
TURBULENT_CONDUCTIVITY_MODEL= CONSTANT_PRANDTL_TURB
PRANDTL_TURB= 0.90

% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
%
REF_ORIGIN_MOMENT_X = 0.25
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_ISOTHERMAL= ( cylinder, 1000.0 )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( cylinder )
MARKER_MONITORING= ( cylinder )

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 1000.0
CFL_ADAPT= NO
CFL_ADAPT_PARAM= ( 1.5, 0.5, 10.0, 10000.0 )
ITER= 20
VENKAT_LIMITER_COEFF= 0.05

% ----------------------- PRESSURE BASED PARAMETERS ---------------------------%
%
RELAXATION_FACTOR_PRESSURE= 1.0
TRANSIENT_TERM_REMOVAL_FACTOR= 0.0
KIND_PB_ITER= SIMPLE
PISO_CORRECTIONS = 4
POISSON_LINEAR_SOLVER= FGMRES
POISSON_LINEAR_SOLVER_PREC= LU_SGS
POISSON_LINEAR_SOLVER_ERROR= 1E-6
POISSON_LINEAR_SOLVER_ITER= 200

% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%
MGLEVEL= 0
MGCYCLE= V_CYCLE

% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ILU_FILL_IN= 0
LINEAR_SOLVER_ERROR= 1E-15
LINEAR_SOLVER_ITER= 10

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= UDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_RESIDUAL_MINVAL= -14
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= mesh_cylinder_lam.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= solution_flow
TABULAR_FORMAT= CSV
CONV_FILENAME= history_pb
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow_pb
SURFACE_FILENAME= surface_flow
OUTPUT_WRT_FREQ= 10
SCREEN_OUTPUT= (INNER_ITER, RMS_PRESSURE, RMS_ENTHALPY, LIFT, DRAG, TOTAL_HEATFLUX)
