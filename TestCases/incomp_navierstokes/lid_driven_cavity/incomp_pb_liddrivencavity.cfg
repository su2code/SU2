%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= INC_NAVIER_STOKES
KIND_INCOMP_SYSTEM = PRESSURE_BASED
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION -------------------%
%
INC_DENSITY_MODEL= CONSTANT
INC_DENSITY_INIT= 1.0
INC_VELOCITY_INIT= ( 0.0, 0.0, 0.0 )

INC_DENSITY_REF= 1.0
INC_VELOCITY_REF= 1.0
INC_NONDIM= REFERENCE_VALUES

% --------------------------- VISCOSITY MODEL ---------------------------------%
%
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 2.5E-3

% ----------------------- DYNAMIC MESH DEFINITION -----------------------------%

% Type of dynamic mesh (NONE, RIGID_MOTION, DEFORMING, ROTATING_FRAME,
%                       MOVING_WALL, FLUID_STRUCTURE, AEROELASTIC, EXTERNAL)
SURFACE_MOVEMENT= MOVING_WALL
MARKER_MOVING= Top
SURFACE_MOTION_ORIGIN = 0.0 0.0 0.0
SURFACE_ROTATION_RATE = 0.0 0.0 0.0
SURFACE_TRANSLATION_RATE = 1.0 0.0 0.0

% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
%
REF_ORIGIN_MOMENT_X = 0.25
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
REF_AREA= 1.0

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_HEATFLUX= ( Top, 0.0, Bottom, 0.0, Left, 0.0, Right, 0.0)
MARKER_PLOTTING= ( Top, Left, Right, Bottom )
MARKER_MONITORING= ( Left, Right, Top )

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 100
CFL_ADAPT= NO
CFL_ADAPT_PARAM= ( 0.95, 1.01, 10, 1000, 0.001, 0)
RK_ALPHA_COEFF= ( 0.66667, 0.66667, 1.000000 )
ITER= 99999

% ----------------------- PRESSURE BASED PARAMETERS ---------------------------%
%
RELAXATION_FACTOR_PBFLOW= 1.0
RELAXATION_FACTOR_RHIECHOW= 0.0
KIND_PB_ITER= SIMPLE
PISO_CORRECTIONS = 2
POISSON_LINEAR_SOLVER= FGMRES
POISSON_LINEAR_SOLVER_PREC= ILU
POISSON_LINEAR_SOLVER_ERROR= 1E-6
POISSON_LINEAR_SOLVER_ITER= 1000

% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= LU_SGS
LINEAR_SOLVER_ERROR= 1E-06
LINEAR_SOLVER_ITER= 1000

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= UDS
MUSCL_FLOW= NO
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= square_50x50.su2
MESH_FORMAT= SU2
MESH_OUT_FILENAME= mesh_out
SOLUTION_FILENAME= solution_flow
SOLUTION_ADJ_FILENAME= solution_adj
TABULAR_FORMAT= CSV
CONV_FILENAME= history_pb
RESTART_FILENAME= restart_flow
RESTART_ADJ_FILENAME= restart_adj
VOLUME_FILENAME= flow_pb
VOLUME_ADJ_FILENAME= adjoint
GRAD_OBJFUNC_FILENAME= of_grad
SURFACE_FILENAME= surface_flow
SURFACE_ADJ_FILENAME= surface_adjoint
OUTPUT_WRT_FREQ= 20
SCREEN_OUTPUT= (INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y, LINSOL)