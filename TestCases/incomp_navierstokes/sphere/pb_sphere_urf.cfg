%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: laminar flow around a sphere, pressure-based,              %
%                    automatic relaxation factors (3D coverage for F2)        %
% Author: Nijso Beishuizen                                                     %
% Institution: Technische Universiteit Eindhoven                               %
% Date: 2024.05.05                                                             %
% File Version 8.5.0 "Harrier"                                                 %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= INC_NAVIER_STOKES
KIND_INCOMP_SYSTEM= PRESSURE_BASED
KIND_TURB_MODEL= NONE
RESTART_SOL= NO
INC_NONDIM= DIMENSIONAL

% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION -------------------%
% Re = rho*V*D/mu = 1*1*2.0/2.0 = 1.0
INC_DENSITY_MODEL= CONSTANT
INC_ENERGY_EQUATION= NO
INC_DENSITY_INIT= 1.0

INC_VELOCITY_INIT= (1.0, 0.0, 0.0 )
INC_VELOCITY_REF = 1
INC_DENSITY_REF = 1.0

% --------------------------- VISCOSITY MODEL ---------------------------------%
%
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 2.0
% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
%
REF_ORIGIN_MOMENT_X = 0.25
REF_ORIGIN_MOMENT_Y = 0.00
REF_ORIGIN_MOMENT_Z = 0.00
% sphere is 1/40 of a complete sphere
% area = pi*r^2 = 3.14159
% 1/40 slice = 0.07854
REF_AREA= 0.07854

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_HEATFLUX= ( wall, 0.0 )
MARKER_SYM= ( symmetry_left, symmetry_right )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( wall )
MARKER_MONITORING= ( wall )

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 10.0
CFL_ADAPT= NO
ITER= 10

% ---------------- PRESSURE-BASED INCOMPRESSIBLE SOLVER DEFINITION ------------%
%
USE_AUTOMATIC_RELAXATION_FACTORS= YES
TRANSIENT_TERM_REMOVAL_FACTOR= 0.0
KIND_PB_ITER= SIMPLE
PISO_CORRECTIONS = 2
POISSON_LINEAR_SOLVER= FGMRES
POISSON_LINEAR_SOLVER_PREC= ILU
POISSON_LINEAR_SOLVER_ERROR= 1E-6
POISSON_LINEAR_SOLVER_ITER= 1000

% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 25

% -------------------------- MULTIGRID PARAMETERS -----------------------------%
%
MGLEVEL= 0

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= UDS
MUSCL_FLOW= NO
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FILENAME= slice_2syms.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= solution_flow
TABULAR_FORMAT= CSV
CONV_FILENAME= history_pb
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow_pb
SURFACE_FILENAME= surface_flow_pb
OUTPUT_WRT_FREQ= 100
WRT_VOLUME_OVERWRITE= YES
SCREEN_OUTPUT= ( INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y, RMS_VELOCITY-Z, LIFT, DRAG, LINSOL_RESIDUAL)
VOLUME_OUTPUT= ( SOLUTION,PRIMITIVE,RESIDUAL,MULTIGRID, RANK )
