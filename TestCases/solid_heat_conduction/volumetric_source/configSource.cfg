%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Solid slab with a uniform volumetric heat source           %
% Author: P. Gaur                                                              %
% Institution: None                                                            %
% Date: 2026.09.29                                                             %
% File Version 8.5.0 "Harrier"                                                 %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%
% A slab of width L = 0.016 m holds both x faces at 300 K, has insulated y faces
% and a uniform source q = 1e6 W/m^3. The exact solution is
% T(x) = 300 + q*x*(L-x)/(2*k), with a maximum of 300 + q*L^2/(8*k) = 302.1333 K
% at x = L/2. The source removed through the x faces is q*L*H = 64 W per unit depth.
%
% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
%
SOLVER= HEAT_EQUATION
%
% ---------------- (SOLIDS) CONDUCTION CONDITION DEFINITION -------------------%
%
INC_NONDIM= DIMENSIONAL
FREESTREAM_TEMPERATURE= 300.0
MATERIAL_DENSITY= 5000
SPECIFIC_HEAT_CP= 500.0
THERMAL_CONDUCTIVITY_CONSTANT= 15.0
%
% ----------------------- VOLUMETRIC HEAT SOURCE ------------------------------%
%
% The ellipse encloses the whole slab, so the source is uniform.
HEAT_SOURCE= YES
HEAT_SOURCE_VAL= 1e6
HEAT_SOURCE_CENTER= (0.008, 0.002, 0.0)
HEAT_SOURCE_AXES= (0.02, 0.02, 1.0)
%
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_ISOTHERMAL= ( x_minus, 300.0, x_plus, 300.0 )
MARKER_HEATFLUX= ( y_minus, 0.0, y_plus, 0.0 )
MARKER_MONITORING= ( x_minus, x_plus )
%
% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 1e8
%
% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-15
LINEAR_SOLVER_ITER= 10
%
% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
ITER= 100
CONV_FIELD= RMS_TEMPERATURE
CONV_RESIDUAL_MINVAL= -14
CONV_STARTITER= 5
%
% -------------------- HEAT NUMERICAL METHOD DEFINITION -----------------------%
%
TIME_DISCRE_HEAT= EULER_IMPLICIT
%
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FORMAT= RECTANGLE
MESH_BOX_SIZE= ( 17, 5, 0 )
MESH_BOX_LENGTH= ( 0.016, 0.004, 0.0 )
SCREEN_OUTPUT= INNER_ITER, RMS_TEMPERATURE, MAX_TEMPERATURE, TOTAL_HEATFLUX, LINSOL_ITER
HISTORY_OUTPUT= (ITER, RMS_RES, HEAT, LINSOL)
OUTPUT_FILES= RESTART_ASCII, PARAVIEW
VOLUME_OUTPUT= SOLUTION
