% Test of the ASCII output writers, which write in parallel with MPI-IO.
% The solution of vandv/rans/flatplate is written without iterating (ITER= 0):
% - SU2_CFD writes RESTART_ASCII,
% - SU2_SOL writes PARAVIEW_ASCII and TECPLOT_ASCII (volume and surface),
% - SU2_DEF (no deformation) writes the SU2 mesh file.
% The files are compared with reference files written on 2 ranks by the previous writers,
% in which the ranks wrote one after the other.
%
% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
SOLVER= RANS
KIND_TURB_MODEL= SST
SST_OPTIONS= V1994m
RESTART_SOL= YES
% ----------- COMPRESSIBLE AND INCOMPRESSIBLE FREE-STREAM DEFINITION ----------%
MACH_NUMBER= 0.2
AOA= 0.0
FREESTREAM_TEMPERATURE= 300.0
REYNOLDS_NUMBER= 5000000.0
REYNOLDS_LENGTH= 1.0
FREESTREAM_TURBULENCEINTENSITY= 0.00038729
FREESTREAM_TURB2LAMVISCRATIO= 0.009
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
MARKER_HEATFLUX= ( wall, 0.0 )
MARKER_FAR= ( farfield )
MARKER_INLET= ( inlet, 302.4, 117691.7874, 1.0, 0.0, 0.0 )
MARKER_OUTLET= ( outlet, 114455.0 )
MARKER_SYM= ( symmetry )
MARKER_PLOTTING= ( wall )
% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CONV_NUM_METHOD_FLOW= ROE
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
ITER= 0
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
MESH_FILENAME= ../vandv/rans/flatplate/mesh_flatplate_turb_035x025.su2
MESH_FORMAT= SU2
MESH_OUT_FILENAME= mesh_out
SOLUTION_FILENAME= ../vandv/rans/flatplate/solution_flow
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
OUTPUT_FILES= (RESTART_ASCII, PARAVIEW_ASCII, TECPLOT_ASCII, SURFACE_PARAVIEW_ASCII, SURFACE_TECPLOT_ASCII)
