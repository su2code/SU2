% Test of the CGNS output writer on a 3D mesh with mixed elements (tetrahedra, pyramids, prisms and
% hexahedra; some markers have both triangles and quadrilaterals, which are written as MIXED sections).
% The laminar bend of incomp_navierstokes/bend is run for a few iterations. At the end, SU2_CFD writes
% the volume CGNS file (boundaries named as the markers), the surface CGNS file (one zone per plotted
% marker) and the restart file.
% The test cgns_mesh_readback_bend.cfg then reads the volume CGNS file as mesh and restarts from this
% restart file, which checks the coordinates, the connectivity, the order of the points and the
% boundary markers written in the CGNS file.
%
% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
SOLVER= INC_NAVIER_STOKES
KIND_TURB_MODEL= NONE
RESTART_SOL= NO
% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION -------------------%
INC_DENSITY_MODEL= CONSTANT
INC_ENERGY_EQUATION= NO
INC_DENSITY_INIT= 1.2886
INC_VELOCITY_INIT= ( 0.1, 0.0, 0.0 )
INC_TEMPERATURE_INIT= 288.15
INC_NONDIM= INITIAL_VALUES
INC_INLET_TYPE= VELOCITY_INLET
INC_OUTLET_TYPE= PRESSURE_OUTLET
% --------------------------- VISCOSITY MODEL ---------------------------------%
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.716E-5
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
MARKER_HEATFLUX= ( WALL1, 0.0, WALL2, 0.0 )
MARKER_INLET= ( INLET, 288.15, 0.1, 1.0, 0.0, 0.0 )
MARKER_OUTLET= ( OUTLET, 0.0 )
MARKER_SYM= ( SYMMETRY )
MARKER_PLOTTING= ( WALL1, WALL2, SYMMETRY )
MARKER_MONITORING= ( WALL1, WALL2 )
% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 100.0
ITER= 3
% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 10
% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
MESH_FILENAME= ../incomp_navierstokes/bend/mesh_bend_coarse.cgns
MESH_FORMAT= CGNS
RESTART_FILENAME= cgns_restart_flow_bend
VOLUME_FILENAME= cgns_flow_bend
SURFACE_FILENAME= cgns_surface_flow_bend
CONV_FILENAME= cgns_history_bend
SCREEN_OUTPUT= INNER_ITER WALL_TIME RMS_PRESSURE RMS_VELOCITY-X RMS_VELOCITY-Y RMS_VELOCITY-Z DRAG
HISTORY_OUTPUT= ITER RMS_RES AERO_COEFF
OUTPUT_FILES= (RESTART, CGNS, SURFACE_CGNS)
