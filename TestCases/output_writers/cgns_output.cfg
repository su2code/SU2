% Test of the CGNS output writer, which writes in parallel with the cgp_* API.
% The flat plate of vandv/rans/flatplate is run for a few iterations from the free stream. At the end,
% SU2_CFD writes the volume CGNS file (boundaries named as the markers), the surface CGNS file
% (one zone per plotted marker) and the restart file.
% The test cgns_mesh_readback.cfg then reads the volume CGNS file as mesh and restarts from this
% restart file, which checks the coordinates, the connectivity, the order of the points and the
% boundary markers written in the CGNS file.
%
% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
SOLVER= RANS
KIND_TURB_MODEL= SST
SST_OPTIONS= V1994m
RESTART_SOL= NO
% ----------- COMPRESSIBLE AND INCOMPRESSIBLE FREE-STREAM DEFINITION ----------%
MACH_NUMBER= 0.2
AOA= 0.0
FREESTREAM_TEMPERATURE= 300.0
REYNOLDS_NUMBER= 5000000.0
REYNOLDS_LENGTH= 1.0
FREESTREAM_TURBULENCEINTENSITY= 0.00038729
FREESTREAM_TURB2LAMVISCRATIO= 0.009
% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
MARKER_HEATFLUX= ( wall, 0.0 )
MARKER_FAR= ( farfield )
MARKER_INLET= ( inlet, 302.4, 117691.7874, 1.0, 0.0, 0.0 )
MARKER_OUTLET= ( outlet, 114455.0 )
MARKER_SYM= ( symmetry )
MARKER_PLOTTING= ( wall, symmetry )
MARKER_MONITORING= ( wall )
% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 10.0
CFL_ADAPT= NO
ITER= 3
% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 10
% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT
% -------------------- TURBULENT NUMERICAL METHOD DEFINITION ------------------%
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT
% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
MESH_FILENAME= ../vandv/rans/flatplate/mesh_flatplate_turb_035x025.su2
MESH_FORMAT= SU2
RESTART_FILENAME= cgns_restart_flow
VOLUME_FILENAME= cgns_flow
SURFACE_FILENAME= cgns_surface_flow
CONV_FILENAME= cgns_history
SCREEN_OUTPUT= INNER_ITER WALL_TIME RMS_DENSITY RMS_MOMENTUM-X RMS_ENERGY RMS_TKE RMS_DISSIPATION DRAG
HISTORY_OUTPUT= ITER RMS_RES AERO_COEFF
OUTPUT_FILES= (RESTART, CGNS, SURFACE_CGNS)
