%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Laminar flow in a pipe, 30 degree sector (one cell in the  %
%                   circumferential direction) with nodes on the rotation axis %
% File Version 8.5.0 "Harrier"                                                 %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%
SOLVER= NAVIER_STOKES
KIND_TURB_MODEL= NONE
RESTART_SOL= NO

% -------------------- COMPRESSIBLE FREE-STREAM DEFINITION --------------------%
%
% The initial flow is along the axis (z)
MACH_NUMBER= 0.2
AOA= 90.0
SIDESLIP_ANGLE= 0.0
FREESTREAM_PRESSURE= 99000.0
FREESTREAM_TEMPERATURE= 300.0
REYNOLDS_NUMBER= 80
REYNOLDS_LENGTH= 1.0
REF_DIMENSIONALIZATION= DIMENSIONAL
%
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.0

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
%
MARKER_PERIODIC= ( per1, per2, 0,0,0, 0,0,30, 0,0,0 )
MARKER_HEATFLUX= ( wall, 0.0 )
INLET_TYPE= TOTAL_CONDITIONS
MARKER_INLET= ( inlet, 300.0, 101000.0, 0.0, 0.0, 1.0 )
MARKER_OUTLET= ( outlet, 100000.0 )
%
MARKER_MONITORING= ( wall )
MARKER_ANALYZE= ( outlet )

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 10.0
TIME_DISCRE_FLOW= EULER_IMPLICIT

% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1e-6
LINEAR_SOLVER_ITER= 20

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
%
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= NO

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
%
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -12
ITER= 5000

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
%
MESH_FORMAT= SU2
MESH_FILENAME= wedge.su2
OUTPUT_WRT_FREQ= 9999
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, RMS_MOMENTUM-Z, RMS_ENERGY, SURFACE_MASSFLOW )
