%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: Inviscid NACA0012 pressure metric computation              %
% Author: Brian Munguía                                                        %
% Institution: Stanford University                                             %
% Date: 2026.08.04                                                             %
% File Version 8.4.0 "Harrier"                                                 %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% SOLVER
%
SOLVER= EULER
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% MESH ADAPTATION
%
COMPUTE_METRIC= YES
NORMALIZE_METRIC= YES
METRIC_SENSOR= PRESSURE, MACH
METRIC_NORM= 2
METRIC_HMAX= 10.0
METRIC_HMIN= 1.0e-6
METRIC_HGRAD= 1.5
% METRIC_ARMAX= 1.0e3
METRIC_COMPLEXITY= 10000
NUM_METHOD_HESS= GREEN_GAUSS
ADAP_ITER= 5
ADAP_TIME_SUBINTERVAL= 1
ADAP_COMPLEXITIES= ( 10000, 20000, 40000 )

% COMPRESSIBLE FREE-STREAM
%
MACH_NUMBER= 0.8
AOA= 1.25
FREESTREAM_TEMPERATURE= 300.0
FREESTREAM_PRESSURE= 101325.0

% REFERENCE VALUES
%
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 1.0
REF_AREA= 1.0
REF_DIMENSIONALIZATION= DIMENSIONAL

% BOUNDARY CONDITIONS
%
MARKER_EULER= ( airfoil )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

% DISCRETIZATION
%
NUM_METHOD_GRAD= GREEN_GAUSS
CONV_NUM_METHOD_FLOW= JST
JST_SENSOR_COEFF= ( 0.5, 0.005 )
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO

% SOLUTION METHODS
%
TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_NUMBER= 100.0
CFL_REDUCTION_TURB= 0.5
CFL_ADAPT= NO
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_ERROR= 0.1
LINEAR_SOLVER_ITER= 10

% CONVERGENCE
%
ITER= 1000
CONV_FIELD= REL_RMS_DENSITY
CONV_RESIDUAL_MINVAL= -3
CONV_STARTITER= 0

% INPUT/OUTPUT
%
% Mesh input file
MESH_FILENAME= inv_naca0012.su2
MESH_FORMAT= SU2
%
% Restart input files
SOLUTION_FILENAME= restart_flow
SOLUTION_ADJ_FILENAME= restart_adj
%
% Output restart files
RESTART_FILENAME= restart_flow
RESTART_ADJ_FILENAME= restart_adj
%
% Output file names
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
TABULAR_FORMAT= CSV
CONV_FILENAME= history
%
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, REL_RMS_DENSITY, DRAG, LIFT, CAUCHY_TAVG_DRAG, CAUCHY_TAVG_LIFT )
HISTORY_OUTPUT= ( INNER_ITER, REL_RMS_RES, RMS_RES, AERO_COEFF, TAVG_AERO_COEFF, CAUCHY )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE, SENSOR_VALUE, SENSOR_GRADIENT, SENSOR_HESSIAN, METRIC, VOLUME, TOTAL_VOLUME )
%
OUTPUT_FILES= ( RESTART, PARAVIEW )
WRT_RESTART_COMPACT= NO
