%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: S809 airfoil, Re = 2e6, AoA = 14.24 deg, FIML inversion    %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
SOLVER= INC_RANS
KIND_TURB_MODEL= SA_FIML
MATH_PROBLEM= DIRECT
RESTART_SOL= YES

% ------------------------- FIELD INVERSION ----------------------------------%
% beta is a field read from the restart (column Beta_FIML), no neural network
KIND_TRAIN_NN= NONE
TRAIN_NN= NO
FIML_SHIELD= LEGACY
% Lift and upper-surface Cp (TargetCp.dat, written by step1_target.py), weighted with
% 1/sigma^2 for sigma_CL = 0.02 and sigma_Cp = 0.05 over the 0.6 m upper surface
OBJECTIVE_FUNCTION= CUSTOM_OBJFUNC
OBJECTIVE_WEIGHT= 1.0
CUSTOM_OBJFUNC= '2500 * pow(LIFT - 1.0546, 2) + 667 * INVERSE_DESIGN_PRESSURE + 0.05 * BETA_REG'

% ---------------- INCOMPRESSIBLE FLOW CONDITION DEFINITION -------------------%
% |V| = 47.9332 m/s at 14.24 deg, Re = rho |V| c / mu = 2.0e6 with c = 0.6 m
FLUID_MODEL= CONSTANT_DENSITY
INC_DENSITY_INIT= 1.2886
INC_VELOCITY_INIT= (46.460356372491553, 11.790795864845876, 0.00)
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.853e-05
FREESTREAM_NU_FACTOR= 3.0

% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
REF_ORIGIN_MOMENT_X= 0.15
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 0.6
REF_AREA= 0.6

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
NUM_METHOD_GRAD= GREEN_GAUSS
NUM_METHOD_GRAD_RECON= LEAST_SQUARES
CFL_NUMBER= 1.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.8, 1.1, 1.0, 100.0 )
ITER= 15000

% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 20

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.01
TIME_DISCRE_FLOW= EULER_IMPLICIT

% -------------------- TURBULENT NUMERICAL METHOD DEFINITION ------------------%
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= YES
TIME_DISCRE_TURB= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
CONV_FIELD= LIFT
CONV_STARTITER= 1000
CONV_CAUCHY_ELEMS= 500
CONV_CAUCHY_EPS= 1E-7

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
MESH_FILENAME= ../S809_FIML_Forward/s809_cmesh.su2
MESH_FORMAT= SU2
READ_BINARY_RESTART= NO
SOLUTION_FILENAME= restart_flow
RESTART_FILENAME= restart_flow
SOLUTION_ADJ_FILENAME= restart_adj
RESTART_ADJ_FILENAME= restart_adj
SURFACE_FILENAME= surface_flow
CONV_FILENAME= history
SCREEN_OUTPUT= INNER_ITER, RMS_PRESSURE, RMS_NU_TILDE, LINSOL_ITER, AVG_CFL, LIFT, DRAG, COMBO
HISTORY_OUTPUT= ITER, RMS_RES, AERO_COEFF, CP_DIFF, FIML, COMBO, CFL_NUMBER
VOLUME_OUTPUT= COORDINATES, SOLUTION, PRIMITIVE, FIML
OUTPUT_FILES= RESTART_ASCII, SURFACE_CSV
WRT_RESTART_COMPACT= NO
OUTPUT_WRT_FREQ= 100000
