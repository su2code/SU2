%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
%                                                                              %
% SU2 configuration file                                                       %
% Case description: S809 airfoil with FIML turbulence correction (Forward)    %
% Author: Ported to v8.5 with FIML implementation                              %
% Date: 2026-07-11                                                             %
%                                                                              %
%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%

% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
SOLVER= INC_RANS
KIND_TURB_MODEL= SA_FIML
RESTART_SOL= YES
% -------------------- INCOMPRESSIBLE FREE-STREAM DEFINITION ------------------%
FREESTREAM_DENSITY= 1.2886
FREESTREAM_VELOCITY= (46.460356372491553, 11.790795864845876, 0.00)
FREESTREAM_VISCOSITY= 1.853e-05
REYNOLDS_LENGTH= 0.6

VISCOSITY_MODEL=CONSTANT_VISCOSITY

% ---------------------- REFERENCE VALUE DEFINITION ---------------------------%
REF_ORIGIN_MOMENT_X= 0.25
REF_ORIGIN_MOMENT_Y= 0.00
REF_ORIGIN_MOMENT_Z= 0.00
REF_LENGTH= 0.6
REF_AREA= 0.6

% -------------------- BOUNDARY CONDITION DEFINITION --------------------------%
MARKER_HEATFLUX= ( airfoil, 0.0 )
MARKER_FAR= ( farfield )
MARKER_PLOTTING= ( airfoil )
MARKER_MONITORING= ( airfoil )

% ------------- COMMON PARAMETERS DEFINING THE NUMERICAL METHOD ---------------%
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 10.0
CFL_ADAPT= NO
ITER= 10000

% ------------------------ LINEAR SOLVER DEFINITION ---------------------------%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-3
LINEAR_SOLVER_ITER= 10

% -------------------- FLOW NUMERICAL METHOD DEFINITION -----------------------%
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= NO
SLOPE_LIMITER_FLOW= NONE
TIME_DISCRE_FLOW= EULER_IMPLICIT

% -------------------- TURBULENT NUMERICAL METHOD DEFINITION ------------------%
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
SLOPE_LIMITER_TURB= NONE
TIME_DISCRE_TURB= EULER_IMPLICIT

% --------------------------- CONVERGENCE PARAMETERS --------------------------%
CONV_FIELD= RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y
CONV_RESIDUAL_MINVAL= -10
CONV_STARTITER= 10
CONV_CAUCHY_ELEMS= 100
CONV_CAUCHY_EPS= 1E-6

% ------------------------- INPUT/OUTPUT INFORMATION --------------------------%
MESH_FILENAME= S809_struct_coarse.su2
MESH_FORMAT= SU2
SCREEN_OUTPUT= INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y, RMS_TKE, LINSOL_ITER, LINSOL_RESIDUAL, LIFT, DRAG
HISTORY_OUTPUT= ITER, RMS_RES, AERO_COEFF
VOLUME_OUTPUT= SOLUTION, PRIMITIVE, RESIDUAL
OUTPUT_FILES= RESTART, PARAVIEW
OUTPUT_WRT_FREQ= 1000

% --------------------- FIML NEURAL NETWORK CONFIGURATION ---------------------%
SA_FIML_CORRECTION= PRODUCTION
TRAIN_NN= NO
KIND_TRAIN_NN= WEIGHTS
N_NEURONS= 20
N_HIDDEN_LAYERS= 3
KIND_NN_SCALING= BOX_COX
ITER_START_NN= 100
FILTER_SHIELD= NO

% Target for inverse design (not used in forward mode, but required for consistency)
TARGET_INVERSE_CL= 1.0546
LAMBDA_FIML= 1.0E-4
