name: Docs Website

on:
  push:
    branches: ['docs_site']
  pull_request:
    branches: ['docs_site']
  workflow_dispatch:
    inputs:
      site_repo:
        description: Website repository
        default: rois1995/su2code.github.io
      site_ref:
        description: Website commit SHA or branch (use a SHA to reproduce a build)
        default: docs_site

permissions:
  contents: read

concurrency:
  group: docs-website-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SU2
        uses: actions/checkout@v4
        with:
          path: su2
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Get release tags for migration reference
        run: git -C su2 fetch --quiet --filter=blob:none https://github.com/su2code/SU2.git 'refs/tags/v7.*:refs/tags/v7.*' 'refs/tags/v8.*:refs/tags/v8.*'
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.site_repo || 'rois1995/su2code.github.io' }}
          ref: ${{ inputs.site_ref || 'docs_site' }}
          path: site
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Setup Ruby and locked gems
        uses: ruby/setup-ruby@v1
        with:
          working-directory: site
          ruby-version: .ruby-version
          bundler: '2.4.22'
          bundler-cache: true
      - name: Install code reference tools
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Build and check website
        env:
          BUNDLE_PATH: ${{ github.workspace }}/site/vendor/bundle
        run: python3 su2/Docs/website/tools/build_docs.py --su2 su2 --site site --build-dir "$RUNNER_TEMP/docs-site" --baseurl '/${{ github.event.repository.name }}' --mark-changes
      - name: Upload checked preview
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: ${{ runner.temp }}/docs-site/site
          retention-days: 7
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/docs-site/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy checked website
        id: deployment
        uses: actions/deploy-pages@v4
