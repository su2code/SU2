name: Docs Website

# Builds the SU2 website with the pages of this repository, the generated
# option reference and the Doxygen code reference, then publishes it on the
# GitHub Pages of this repository.

on:
  push:
    branches:
      - 'docs_site'
  workflow_dispatch:
    inputs:
      site_repo:
        description: 'Website repository'
        default: 'rois1995/su2code.github.io'
      site_ref:
        description: 'Website branch'
        default: 'docs_site'

env:
  SITE_REPO: ${{ inputs.site_repo || 'rois1995/su2code.github.io' }}
  SITE_REF: ${{ inputs.site_ref || 'docs_site' }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SU2
        uses: actions/checkout@v4
        with:
          path: su2
          # The history (without file contents) finds the developer pages that may be out of date.
          fetch-depth: 0
          filter: blob:none
      - name: Get the release tags
        # The fork may miss some tags; the renamed options page needs all of them.
        run: git -C su2 fetch --quiet --filter=blob:none https://github.com/su2code/SU2.git 'refs/tags/v7.*:refs/tags/v7.*' 'refs/tags/v8.*:refs/tags/v8.*'
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SITE_REPO }}
          ref: ${{ env.SITE_REF }}
          path: site
          # Some history to compare with the official website (--mark-changes).
          fetch-depth: 50
          filter: blob:none
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build code reference
        working-directory: su2
        run: |
          sudo apt-get update && sudo apt-get install -y doxygen graphviz
          ( cat doxyfile
            echo "OUTPUT_DIRECTORY = ../doxygen"
            echo "PROJECT_NUMBER = $(git rev-parse --short=10 HEAD)"
            echo "SOURCE_BROWSER = NO"
            echo "CALL_GRAPH = NO"
            echo "CALLER_GRAPH = NO"
            echo "COLLABORATION_GRAPH = NO"
            echo "INCLUDE_GRAPH = NO"
            echo "INCLUDED_BY_GRAPH = NO"
            echo "DIRECTORY_GRAPH = NO"
            echo "DOT_IMAGE_FORMAT = svg"
            echo "WARN_LOGFILE = ../doxygen_warnings.txt"
            echo "EXCLUDE = ./Docs/website"
          ) | doxygen -
      - name: Prepare website
        run: python3 su2/Docs/website/tools/build_site.py --su2 su2 --site site --light --doxygen-log doxygen_warnings.txt --mark-changes
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Build website
        working-directory: site
        run: |
          bundle install --jobs 4
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}" -d ../_site
      - name: Assemble
        run: |
          python3 su2/Docs/website/tools/rebase_links.py _site "${{ steps.pages.outputs.base_path }}"
          cp -r doxygen/html _site/doxygen
          du -sh _site
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
